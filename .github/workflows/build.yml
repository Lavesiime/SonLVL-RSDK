name: Build SonLVL Tools
on: [push, workflow_dispatch]
jobs:
   build:
     runs-on: windows-latest
     steps:
       - name: Checkout repository 
         uses: actions/checkout@v4
       - name: Setup MSBuild
         uses: microsoft/setup-msbuild@v2
       - name: Build projects
         run: |
          msbuild SonLVL.sln /p:Configuration=Release
       - name: Upload SonLVL artifacts
         uses: actions/upload-artifact@v4
         with:
           name: SonLVL
           path: SonLVL/bin/Release
    
